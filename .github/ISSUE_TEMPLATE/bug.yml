name: Skill misbehaved
description: A skill did something wrong in a real session
body:
  - type: input
    id: skill
    attributes:
      label: Which skill?
    validations:
      required: true
  - type: textarea
    id: ran
    attributes:
      label: What did you run, what happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and model (e.g. Claude Code, Codex)
